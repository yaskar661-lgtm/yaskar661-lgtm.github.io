<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CNN Türk Stream</title>
    <style>
        /* Gizli sayfa - hiçbir şey görünmez */
        body { 
            background: transparent; 
            margin: 0; 
            padding: 0; 
            opacity: 0;
            visibility: hidden;
            display: none;
        }
    </style>
</head>
<body>
    <!-- Bu sayfa tamamen gizli çalışır -->
    <div id="status"></div>
    
    <script>
        (function() {
            // Content ID'yi kullan
            const contentId = "62d6814670380e2cdc7c124c";
            const currentUrl = window.location.href;
            const baseUrl = "https://cnn.impresents.workers.dev/canli-yayin.m3u8";
            
            console.log('🚀 CNN Türk Stream başlatıldı (Gizli mod)');
            console.log('📌 Content ID:', contentId);
            
            // Stream URL'sini al
            async function getStream() {
                try {
                    const apiUrl = 'https://www.cnnturk.com/api/cnnvideo/media?id=' + contentId + '&isMobile=false';
                    console.log('🌐 API isteği:', apiUrl);
                    
                    const response = await fetch(apiUrl, {
                        headers: {
                            'User-Agent': navigator.userAgent,
                            'Referer': 'https://www.cnnturk.com/'
                        }
                    });
                    
                    if (!response.ok) {
                        throw new Error('API hatası: ' + response.status);
                    }
                    
                    const data = await response.json();
                    console.log('✅ API yanıtı alındı');
                    
                    if (!data.Media || !data.Media.Link || !data.Media.Link.DefaultServiceUrl || !data.Media.Link.SecurePath) {
                        throw new Error('Stream bilgileri bulunamadı.');
                    }
                    
                    // Stream URL'sini oluştur
                    let baseUrlApi = data.Media.Link.DefaultServiceUrl;
                    if (baseUrlApi.endsWith('/')) {
                        baseUrlApi = baseUrlApi.slice(0, -1);
                    }
                    
                    const streamUrl = baseUrlApi + data.Media.Link.SecurePath;
                    console.log('🎬 Stream URL:', streamUrl);
                    
                    // Stream URL'sini Worker'a gönder (parametre olarak)
                    const redirectUrl = baseUrl + '?stream=' + encodeURIComponent(streamUrl);
                    console.log('🔄 Yönlendiriliyor:', redirectUrl);
                    
                    // Hemen yönlendir
                    window.location.replace(redirectUrl);
                    
                } catch (error) {
                    console.error('❌ Hata:', error.message);
                    // Hata durumunda kullanıcıya bilgi ver (gizli değil)
                    document.body.style.opacity = '1';
                    document.body.style.visibility = 'visible';
                    document.body.style.display = 'block';
                    document.body.innerHTML = '<div style="font-family:Arial;padding:20px;text-align:center;background:#1a1a1a;color:white;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;"><h2 style="color:#e74c3c;">❌ Hata</h2><p>' + error.message + '</p><p style="font-size:12px;color:#888;margin-top:20px;">Lütfen sayfayı yenileyin</p></div>';
                }
            }
            
            // Sayfa yüklendiğinde çalıştır
            if (document.readyState === 'complete' || document.readyState === 'interactive') {
                getStream();
            } else {
                document.addEventListener('DOMContentLoaded', getStream);
            }
        })();
    </script>
</body>
</html>
