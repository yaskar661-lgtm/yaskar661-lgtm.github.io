<!DOCTYPE html>
<html lang="tr">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>Vav TV Canlı Yayın - HD</title>
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<link rel="icon" href="https://i.tmgrup.com.tr/vavtv/site/v2/c/i/favicon.ico" />
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background-color: #121622;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        overflow-x: hidden;
    }
    header {
        background: linear-gradient(90deg, #131A2E 0%, #282828 100%);
        padding: 12px 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #1f293d;
        position: sticky;
        top: 0;
        z-index: 1000;
    }
    .vavradyo-logo img {
        max-height: 32px;
        width: auto;
    }
    .main-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 12px;
        max-width: 1200px;
        margin: 0 auto;
        width: 100%;
    }
    .page-head-area {
        margin-bottom: 10px;
    }
    .resource-title {
        font-size: 18px;
        font-weight: 600;
        color: #00A3C0;
        border-left: 4px solid #00A3C0;
        padding-left: 8px;
    }
    .streaming {
        background: #191f38;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    /* Oynatıcı Alanı ve Oran Sabitleme */
    .streaming-player {
        position: relative;
        width: 100%;
        background: #000;
        aspect-ratio: 16/9;
    }
    .streaming-player > div {
        width: 100% !important;
        height: 100% !important;
    }
    /* Turkuvaz oynatıcı içindeki olası harici taşma kutularını gizleme */
    .streaming-player iframe, .streaming-player video {
        width: 100% !important;
        height: 100% !important;
        border: none !important;
    }
    .streaming-info {
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .channel-name {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 15px;
        font-weight: bold;
    }
    .channel-name img {
        width: 28px;
        height: 28px;
        border-radius: 50%;
    }
</style>
</head>
<body>

<header>
    <div class="vavradyo-logo">
        <a href="#">
            <img src="https://i.tmgrup.com.tr/vavtv/site/v2/c/i/vavtv-logo.svg" alt="Vav TV">
        </a>
    </div>
    <div style="font-size: 13px; font-weight: bold; color: #00A3C0;">CANLI YAYIN</div>
</header>

<main class="main-wrapper">
    <div class="page-head-area">
        <h1 class="resource-title">Canlı Yayın</h1>
    </div>
    
    <div class="streaming">
        <div class="streaming-player">
            <!-- Resmi Turkuvaz Video Player Konteyneri -->
            <div data-autoplay="false" 
                 data-sid="3ezn31edm5kxlr2fssykjokm" 
                 data-type="playerlive" 
                 data-videoid="00000000-0000-0000-0000-000000000000" 
                 data-vp="tmdvpcontainer" 
                 data-websiteid="c71d7dd4-1b6c-4cf6-a4fe-38d864c6d052" 
                 id="tmdVp00000000-0000-0000-0000-000000000000">
            </div>
        </div>

        <div class="streaming-info">
            <div class="channel-name">
                <i><img src="https://ia.tmgrup.com.tr/babfd5/64/64/0/0/512/512?u=https://i.tmgrup.com.tr/rt/2023/05/08/1683550851741.png" alt=""></i> 
                <span>Vav TV</span>
            </div>
        </div>
    </div>
</main>

<!-- Turkuvaz Oynatıcı Kurulum Scripti -->
<script>
    var scriptobj = document.createElement("script");
    scriptobj.type = "text/javascript";
    scriptobj.src = "https://i.tmgrup.com.tr/videojs/js/tmdplayersetupv2.js?v=931";
    document.head.appendChild(scriptobj);
</script>

</body>
</html>
