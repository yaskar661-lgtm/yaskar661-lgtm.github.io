<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turkuvaz Medya Güvenli Yayın Oynatıcı</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 15px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background: #e50914;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #f40612;
            opacity: 0.9;
        }
        pre {
            background: #111;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            color: #4caf50;
        }
        video {
            width: 100%;
            max-height: 450px;
            background: #000;
            margin-top: 15px;
            border-radius: 4px;
        }
    </style>
    <!-- HLS.js Kütüphanesi (Tarayıcıda .m3u8 oynatabilmek için) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

<div class="container">
    <h2>Turkuvaz Medya Token & Akış Alıcı</h2>
    
    <label for="rawUrlInput">Ham Madde (.m3u8) URL:</label>
    <input type="text" id="rawUrlInput" value="https://trkvz-live.ercdn.net/atvhd/atvhd.m3u8">
    
    <button onclick="fetchSecureStream()">Token Al ve Yayınla</button>
    
    <h3>İşlem Logları / Çıktı URL:</h3>
    <pre id="outputLog">Bekleniyor...</pre>

    <video id="videoPlayer" controls autoplay></video>
</div>

<script>
    async function fetchSecureStream() {
        const rawUrl = document.getElementById('rawUrlInput').value.trim();
        const logElement = document.getElementById('outputLog');
        const videoElement = document.getElementById('videoPlayer');

        if (!rawUrl) {
            alert("Lütfen geçerli bir URL girin!");
            return;
        }

        logElement.innerText = "Token isteniyor...";

        // 1. Rastgele sayı üretimi
        const randNum = Math.floor(Math.random() * 900000) + 100000;

        // 2. İstediğiniz endpoint yapısı
        const secureApi = `https://securevideotoken.tmgrup.com.tr/webtv/secure?${randNum}&url=${encodeURIComponent(rawUrl)}`;

        // Not: Tarayıcılar (CORS kısıtlamaları nedeniyle) doğrudan dış kaynaklara özel header'lar ekleyerek fetch atamayabilir. 
        // Eğer CORS hatası alırsanız, bu isteği bir aracı (CORS proxy veya kendi backend'iniz) üzerinden atmanız gerekebilir.
        const headers = {
            'Accept': 'application/json, text/javascript, */*; q=0.01',
            'X-Requested-With': 'XMLHttpRequest'
        };

        try {
            // Doğrudan tarayıcıdan atılan isteklerde CORS engeline takılmamak için mode: 'cors' veya bir proxy gerekebilir.
            const response = await fetch(secureApi, {
                method: 'GET',
                headers: headers,
                mode: 'cors' // Sunucu izin veriyorsa çalışır
            });

            if (!response.ok) {
                throw new Error(`HTTP Hata! Durum: ${response.status} (CORS engeline takılmış olabilirsiniz)`);
            }

            const data = await response.json();
            let finalStreamUrl = data.Url || data.url || data.SecureUrl;

            if (!finalStreamUrl) {
                throw new Error("API yanıtından akış URL'si çıkarılamadı.");
            }

            // 3. DaiOn ve Ercdn parametre desteği ekleme
            const urlObj = new URL(finalStreamUrl);
            
            // İstediğiniz ek parametreler
            urlObj.searchParams.set('daion', 'true');
            urlObj.searchParams.set('ercdn', 'true');

            const securedFinalUrl = urlObj.toString();
            logElement.innerText = `Başarılı!\nOluşturulan Güvenli URL:\n${securedFinalUrl}`;

            // 4. Video Oynatıcıya Aktarma (HLS.js ile)
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(securedFinalUrl);
                hls.attachMedia(videoElement);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    videoElement.play();
                });
            } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                // Safari gibi yerel HLS desteği olan tarayıcılar için
                videoElement.src = securedFinalUrl;
                videoElement.addEventListener('loadedmetadata', function() {
                    videoElement.play();
                });
            }

        } catch (error) {
            logElement.innerText = `Hata Oluştu:\n${error.message}\n\nİpucu: Tarayıcı güvenlik (CORS) politikaları nedeniyle tarayıcı üstünden yapılan bu istek engelleniyorsa, bu kodu Node.js veya Python tabanlı bir sunucu/proxy ortamında çalıştırmanız gerekebilir.`;
            console.error(error);
        }
    }
</script>

</body>
</html>
